name: 'Build Astro'
description: 'Installs dependencies with npm caching, builds the Astro site, and uploads dist artifact'

inputs:
  node-version:
    description: 'Node.js version to use'
    required: false
    default: '22'
  artifact-name:
    description: 'Name of the artifact to upload'
    required: false
    default: 'dist'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'

    - name: Install dependencies
      shell: bash
      run: npm ci

    - name: Build Astro site
      shell: bash
      run: npm run build

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: dist/