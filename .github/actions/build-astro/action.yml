name: 'Build Astro'
description: 'Install dependencies with npm cache, build the Astro static site, and upload the dist artifact.'

inputs:
  node-version:
    description: 'Node.js version to use for the build.'
    required: false
    default: '22'
    type: string
  artifact-name:
    description: 'Name to give the uploaded build artifact.'
    required: false
    default: 'dist'
    type: string

runs:
  using: 'composite'
  steps:
    - name: Setup Node
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v4.0.2
      with:
        node-version: ${{ inputs.node-version }}
        cache: 'npm'

    - name: Install
      shell: bash
      run: npm ci

    - name: Build
      shell: bash
      run: npm run build

    - name: Upload dist
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.1.1
      with:
        name: ${{ inputs.artifact-name }}
        path: dist/